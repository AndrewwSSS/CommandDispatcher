; Host-side unit tests for the library: pio test -e native
;
; CommandDispatcher.h compiles against test/fake/Arduino.h instead of a real core.
; Sketches that use the library never read this file - they build it from
; library.json against their own board.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
; Only test_* folders are suites; test/fake holds the stand-in core.
test_filter = test_*
build_flags =
    -std=gnu++17
    -I src
    -I test/fake
